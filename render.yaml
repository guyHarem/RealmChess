# Setup for hosting on Render (render.com). In the Render dashboard: New > Blueprint, pick
# this repository, and Render creates the service described here.
#
# One service runs everything: it builds the pages, then serve.py serves pages and API.
# Keep it at one instance: games live in the server's memory (see serve.py).
services:
  - type: web
    name: realmchess       # also reachable at realmchess.onrender.com
    # Render adds www.realmchess.com by itself and sends it on to realmchess.com. The DNS
    # records at the domain's registrar: see "Custom domain" in the README.
    domains:
      - realmchess.com
    runtime: python
    # Half a CPU core and 512 MB. The free plan will not do: it sleeps after 15 idle minutes,
    # which ends every game, and has a tenth of a core for the computer player. One step up
    # (standard: one core, 2 GB) lets Hard think on a whole core.
    plan: starter
    region: frankfurt        # cannot be changed later: oregon, ohio, virginia, frankfurt, singapore
    branch: main
    numInstances: 1
    # Every push to main goes live. Games live in memory; on a deploy the old server hands
    # them to the new one as it stops (api/handoff.py), so they carry on. A crash still ends them.
    autoDeployTrigger: commit
    buildCommand: >-
      pip install -r requirements.txt &&
      npm --prefix realmchess-frontend ci --include=dev &&
      npm --prefix realmchess-frontend run build
    startCommand: python serve.py     # listens on the PORT Render gives it
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: NODE_VERSION            # only used to build the pages
        value: 24.21.0
      # The server would guess from the machine's core count, which is the whole shared
      # machine and not this plan's share. Make it 2 on a plan with two cores or more.
      - key: REALMCHESS_THINKERS
        value: "1"
      # Render adds two entries to X-Forwarded-For (measured on this service, October 2026).
      # Check after a change: /api/health must show your own public address as "visitor".
      - key: REALMCHESS_TRUST_PROXY
        value: "2"
      # The secret the old server shows the new one when handing over the games on a deploy.
      # Render makes one up once; it is sent to RENDER_EXTERNAL_URL, which Render sets.
      - key: REALMCHESS_HANDOFF_KEY
        generateValue: true
      # The key for the admin page (realmchess.com/#/admin): play counts and feedback. Render
      # makes one up once; copy it from the service's Environment page in the dashboard.
      - key: REALMCHESS_ADMIN_KEY
        generateValue: true
