<!doctype html>
<!--
  Source of the link preview and home-screen icons in public/. Each is this page at one size:
    ?image=preview   1200x630  public/preview.png   (shown when a link to the site is shared)
    ?image=icon      512x512   public/icon-512.png, and resized: icon-192.png, apple-touch-icon.png
  dev/share-images.sh screenshots them with headless Chrome.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RealmChess share images</title>
    <style>
      @font-face {
        font-family: 'Outfit';
        src: url('../node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #0e1117;
        color: #eef1f6;
        font-family: 'Outfit', sans-serif;
      }
      .preview {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 96px;
        box-sizing: border-box;
      }
      .preview svg {
        width: 300px;
        height: 300px;
        flex: none;
      }
      .preview h1 {
        margin: 0;
        font-size: 120px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .preview h1 span {
        font-weight: 300;
      }
      .preview p {
        margin: 28px 0 0;
        font-size: 34px;
        color: #9aa4b5;
      }
      .layers {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        display: flex;
      }
      .layers i {
        flex: 1;
      }
      .icon {
        height: 100%;
        display: grid;
        place-items: center;
      }
      /* The rook stays inside the middle 80%, the part any home-screen mask keeps */
      .icon svg {
        width: 72%;
        height: 72%;
      }
    </style>
  </head>
  <body>
    <template id="rook">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M22 10h13v10h8V10h14v10h8V10h13v14H22Z" fill="#4A78D6" />
        <path d="M22 27h56v5l-9 8v1H31v-1l-9-8Z" fill="#7EC3F2" />
        <path d="M31 44h38v14H31Z" fill="#86CF7A" />
        <path d="M31 61h38v11l3.375 3h-44.75L31 72Z" fill="#B49AE8" />
        <path d="M24.25 78h51.5L78 80v12H22V80Z" fill="#6B4FB8" />
      </svg>
    </template>
    <script>
      const rook = document.getElementById('rook').innerHTML
      const image = new URLSearchParams(location.search).get('image') ?? 'preview'
      document.body.innerHTML =
        image === 'icon'
          ? `<div class="icon">${rook}</div>`
          : `<div class="preview">${rook}<div><h1>Realm<span>Chess</span></h1>
             <p>Chess on five stacked boards.<br>Climb to the sky, or drop into the dungeon.</p></div></div>
             <div class="layers">${['#4A78D6', '#7EC3F2', '#86CF7A', '#B49AE8', '#6B4FB8'].map((c) => `<i style="background:${c}"></i>`).join('')}</div>`
    </script>
  </body>
</html>
